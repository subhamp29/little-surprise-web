<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0f5"/>
      <stop offset="100%" stop-color="#fbd3e3"/>
    </linearGradient>
    <linearGradient id="bgWarm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcedeb"/>
      <stop offset="50%" stop-color="#fbe0ec"/>
      <stop offset="100%" stop-color="#eed8f5"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgWarm)"/>
  
  <!-- Table surface -->
  <path d="M 0,230 Q 200,210 400,230 L 400,300 L 0,300 Z" fill="#edd6e2" opacity="0.7"/>

  <!-- Saucer -->
  <ellipse cx="200" cy="225" rx="65" ry="14" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="200" cy="223" rx="55" ry="10" fill="#f8c8dc" opacity="0.5"/>

  <!-- Coffee Cup -->
  <path d="M 160,150 Q 160,215 200,215 Q 240,215 240,150 Z" fill="url(#cupGrad)" stroke="#eed5e1" stroke-width="2"/>
  
  <!-- Handle -->
  <path d="M 235,160 Q 265,160 260,185 Q 255,200 235,198" fill="none" stroke="#fbc5db" stroke-width="6" stroke-linecap="round"/>

  <!-- Latte Art Heart -->
  <ellipse cx="200" cy="155" rx="36" ry="12" fill="#c99c82"/>
  <ellipse cx="200" cy="155" rx="34" ry="10" fill="#dfbba5"/>
  <path d="M200,161 C196,155 190,152 193,149 C196,146 200,150 200,153 C200,150 204,146 207,149 C210,152 204,155 200,161 Z" fill="#ffffff" opacity="0.9"/>

  <!-- Steaming Hearts -->
  <g fill="none" stroke="#e8a8c4" stroke-width="2" stroke-linecap="round" opacity="0.75">
    <path d="M 190,135 Q 185,115 192,100" />
    <path d="M 210,130 Q 215,110 208,95" />
  </g>
  <path d="M200,85 C197,80 192,78 194,75 C197,72 200,76 200,78 C200,76 203,72 206,75 C208,78 203,80 200,85 Z" fill="#f3a7c6" opacity="0.7"/>

  <!-- Gentle sparkles around -->
  <g fill="#fff" opacity="0.8">
    <path d="M110,110 Q110,116 116,116 Q110,116 110,122 Q110,116 104,116 Q110,116 110,110 Z"/>
    <path d="M290,120 Q290,125 295,125 Q290,125 290,130 Q290,125 285,125 Q290,125 290,120 Z"/>
  </g>
</svg>

