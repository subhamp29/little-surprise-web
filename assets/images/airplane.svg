<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60" width="100" height="60">
  <defs>
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f2f8ff"/>
      <stop offset="100%" stop-color="#d9ecff"/>
    </linearGradient>
    <filter id="planeShadow">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#557e9e" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#planeShadow)">
    <!-- Main wing fold with pastel sky-blue gradient -->
    <polygon points="5,28 92,6 40,48" fill="url(#planeGrad)" stroke="#cce4fb" stroke-width="0.8"/>
    <!-- Top inner wing fold -->
    <polygon points="5,28 92,6 35,32" fill="#f8fcff" stroke="#bfe0fd" stroke-width="0.8"/>
    <!-- Bottom keel with soft ocean-blue tone -->
    <polygon points="35,32 92,6 40,48" fill="#aed6fa" opacity="0.85"/>
    <!-- Tiny pastel blue heart stamped on wing -->
    <path d="M48,22 C46,19 43,18 44,15 C46,13 49,16 49,18 C49,16 52,13 54,15 C55,18 52,19 48,22 Z" fill="#6bafe8" opacity="0.9"/>
  </g>
</svg>
