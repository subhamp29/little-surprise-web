<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#e8f4ff"/>
      <stop offset="100%" stop-color="#d0e8ff"/>
    </radialGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft3">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg3)"/>

  <!-- Soft glow circles for dreamy atmosphere -->
  <circle cx="80" cy="80" r="55" fill="#c5e3ff" opacity="0.3" filter="url(#soft3)"/>
  <circle cx="320" cy="220" r="65" fill="#e0d0ff" opacity="0.3" filter="url(#soft3)"/>
  <circle cx="310" cy="70" r="40" fill="#c5f0e8" opacity="0.25" filter="url(#soft3)"/>

  <!-- Butterfly top-right, decorative -->
  <g transform="translate(340,42) rotate(-15)" opacity="0.5">
    <ellipse cx="-8" cy="0" rx="12" ry="8" fill="#b3d4ff"/>
    <ellipse cx="8" cy="0" rx="12" ry="8" fill="#c5e3ff"/>
    <ellipse cx="-5" cy="4" rx="7" ry="5" fill="#9bbff0"/>
    <ellipse cx="5" cy="4" rx="7" ry="5" fill="#9bbff0"/>
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#7098c8" stroke-width="1.2"/>
  </g>

  <!-- Left side: her chat bubble (playful teasing) -->
  <rect x="30" y="68" width="145" height="38" rx="14" fill="#ffffff" stroke="#b3d4ff" stroke-width="1.8" filter="url(#glow3)"/>
  <text x="45" y="87" font-size="11" fill="#3a6fa0" font-family="sans-serif">Ek baat bataun? 😂</text>
  <text x="45" y="100" font-size="10" fill="#6a9fcf" font-family="sans-serif">Haan bolo!</text>
  <!-- Tail left -->
  <polygon points="30,88 15,96 30,96" fill="#ffffff" stroke="#b3d4ff" stroke-width="1"/>

  <!-- Right side: reply bubble -->
  <rect x="225" y="130" width="140" height="30" rx="12" fill="#e0d0ff" stroke="#c5b0ee" stroke-width="1.5" filter="url(#glow3)"/>
  <text x="240" y="150" font-size="11" fill="#5a3a90" font-family="sans-serif">Tum bhi na 😂</text>
  <!-- Tail right -->
  <polygon points="365,140 380,148 365,152" fill="#e0d0ff" stroke="#c5b0ee" stroke-width="1"/>

  <!-- Her question bubble 2 -->
  <rect x="30" y="175" width="160" height="38" rx="14" fill="#ffffff" stroke="#b3d4ff" stroke-width="1.8" filter="url(#glow3)"/>
  <text x="45" y="193" font-size="11" fill="#3a6fa0" font-family="sans-serif">Achha ji, ab maine kya kiya?</text>
  <text x="45" y="207" font-size="10" fill="#6a9fcf" font-family="sans-serif">Kuch nahi, bas aise hi 😂</text>
  <polygon points="30,196 15,204 30,204" fill="#ffffff" stroke="#b3d4ff" stroke-width="1"/>

  <!-- Right reply bubble 2 -->
  <rect x="230" y="232" width="128" height="28" rx="12" fill="#c5f0e8" stroke="#90d8c0" stroke-width="1.5" filter="url(#glow3)"/>
  <text x="244" y="250" font-size="10.5" fill="#2a7a60" font-family="sans-serif">Hahaha! 😂</text>
  <polygon points="358,242 374,250 358,250" fill="#c5f0e8" stroke="#90d8c0" stroke-width="1"/>

  <!-- Little sparkle dots floating -->
  <circle cx="200" cy="50" r="3" fill="#b3d4ff" opacity="0.6"/>
  <circle cx="215" cy="38" r="2" fill="#c5b0ee" opacity="0.5"/>
  <circle cx="185" cy="62" r="2.5" fill="#c5f0e8" opacity="0.6"/>
  <circle cx="30" cy="150" r="2.5" fill="#b3d4ff" opacity="0.4"/>
  <circle cx="380" cy="100" r="3" fill="#c5b0ee" opacity="0.4"/>

  <!-- Label -->
  <text x="200" y="284" text-anchor="middle" font-size="13.5" fill="#3a6fa0" font-family="'Georgia', serif" font-style="italic" opacity="0.9">Random baatein aur hasi-mazaak 😄</text>
</svg>