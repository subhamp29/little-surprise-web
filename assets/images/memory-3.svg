<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="nightPastel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#403254"/>
      <stop offset="50%" stop-color="#73577d"/>
      <stop offset="100%" stop-color="#b58aa7"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8db" stop-opacity="1"/>
      <stop offset="50%" stop-color="#ffd5e5" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffd5e5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#nightPastel)"/>
  
  <!-- Glowing Moon -->
  <circle cx="200" cy="110" r="50" fill="url(#moonGlow)"/>
  <circle cx="200" cy="110" r="32" fill="#fffef4"/>

  <!-- Star Constellations & Sparkles -->
  <g fill="#ffffff">
    <circle cx="90" cy="65" r="2" opacity="0.9"/>
    <circle cx="120" cy="85" r="2.5" opacity="0.95"/>
    <circle cx="150" cy="55" r="1.5" opacity="0.8"/>
    <circle cx="270" cy="60" r="2" opacity="0.9"/>
    <circle cx="310" cy="90" r="2.5" opacity="0.85"/>
    <circle cx="290" cy="140" r="1.5" opacity="0.8"/>
    <circle cx="80" cy="150" r="2" opacity="0.9"/>
    <!-- Sparkle shapes -->
    <path d="M120,85 L122,81 L126,85 L122,89 Z" opacity="0.6"/>
    <path d="M280,75 Q280,82 287,82 Q280,82 280,89 Q280,82 273,82 Q280,82 280,75 Z" opacity="0.8"/>
    <path d="M70,90 Q70,96 76,96 Q70,96 70,102 Q70,96 64,96 Q70,96 70,90 Z" opacity="0.75"/>
  </g>
  <path d="M90,65 L120,85 L150,55" fill="none" stroke="#fff" stroke-dasharray="2,3" stroke-width="0.8" opacity="0.5"/>

  <!-- Dreamy mountain silhouettes -->
  <path d="M 0,240 Q 90,195 190,230 T 400,210 L 400,300 L 0,300 Z" fill="#2c223c" opacity="0.75"/>
  <path d="M 0,260 Q 150,220 280,250 T 400,240 L 400,300 L 0,300 Z" fill="#1e1628" opacity="0.9"/>
</svg>

