    <path d="M 20,110 Q 30,110 30,100 L 30,110 Q 30,118 38,118 L 70,118 Q 78,118 78,110 Z"/>
  </g>
  <text x="42" y="87" font-family="Caveat, cursive" font-size="11" fill="#5a3e5e">Achha tha, tum batao!</text>

