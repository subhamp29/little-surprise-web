<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <radialGradient id="bg1" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#fff0f8"/>
      <stop offset="100%" stop-color="#fce4f3"/>
    </radialGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg1)" rx="0"/>

  <!-- Floating hearts background -->
  <text x="30" y="55" font-size="14" fill="#ffb3cc" opacity="0.5">♡</text>
  <text x="355" y="80" font-size="10" fill="#c9b0e8" opacity="0.5">♡</text>
  <text x="20" y="240" font-size="12" fill="#ffb3cc" opacity="0.4">♡</text>
  <text x="370" y="250" font-size="16" fill="#c9b0e8" opacity="0.4">♡</text>
  <text x="60" y="275" font-size="10" fill="#ffb3cc" opacity="0.3">♡</text>
  <text x="330" y="30" font-size="12" fill="#f5a0c8" opacity="0.3">♡</text>

  <!-- Phone body -->
  <rect x="145" y="30" width="110" height="190" rx="18" ry="18" fill="#fff" stroke="#f0bfda" stroke-width="2.5" filter="url(#glow1)"/>
  <!-- Phone notch -->
  <rect x="175" y="38" width="50" height="8" rx="4" fill="#f0bfda" opacity="0.6"/>
  <!-- Screen area -->
  <rect x="153" y="52" width="94" height="155" rx="6" fill="#fff8fc"/>

  <!-- Chat bubbles — received (left, pink) -->
  <rect x="157" y="60" width="58" height="22" rx="10" fill="#ffd6ea"/>
  <text x="163" y="75" font-size="9" fill="#9b4870" font-family="sans-serif">Hii! Kaisi ho? 😊</text>

  <rect x="157" y="90" width="52" height="22" rx="10" fill="#ffd6ea"/>
  <text x="163" y="105" font-size="9" fill="#9b4870" font-family="sans-serif">Aaj ka din kaisa tha?</text>

  <!-- Chat bubbles — sent (right, lavender) -->
  <rect x="186" y="120" width="55" height="22" rx="10" fill="#e8d5ff"/>
  <text x="192" y="135" font-size="9" fill="#6b3fa0" font-family="sans-serif">Achha tha, tum batao!</text>

  <!-- Received -->
  <rect x="157" y="150" width="62" height="22" rx="10" fill="#ffd6ea"/>
  <text x="163" y="165" font-size="9" fill="#9b4870" font-family="sans-serif">Mera bhi theek tha!</text>

  <!-- Sent -->
  <rect x="190" y="180" width="52" height="22" rx="10" fill="#e8d5ff"/>
  <text x="196" y="195" font-size="9" fill="#6b3fa0" font-family="sans-serif">Chalo, kuch aur baatein karte hain 😄</text>

  <!-- Tiny floating hearts near phone -->
  <text x="270" y="100" font-size="20" fill="#f7a8c8" opacity="0.7" filter="url(#glow1)">♡</text>
  <text x="110" y="130" font-size="16" fill="#c9b0e8" opacity="0.6">♡</text>
  <text x="280" y="160" font-size="12" fill="#ffb3cc" opacity="0.5">♡</text>

  <!-- Label at bottom -->
  <text x="200" y="250" text-anchor="middle" font-size="14" fill="#c06090" font-family="'Georgia', serif" font-style="italic" opacity="0.9">Random si baatein aur hasi-mazaak 😊</text>
</svg>