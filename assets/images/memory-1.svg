  <g fill="#ffffff" opacity="0.9" filter="url(#softGlow1)">
    <path d="M 20,140 Q 30,140 30,130 L 30,110 Q 30,102 38,102 L 90,102 Q 98,102 98,110 L 98,130 Q 98,140 90,140 Z"/>
    <path d="M 20,140 Q 30,140 30,130 L 30,140 Q 30,148 38,148 L 90,148 Q 98,148 98,140 Z"/>
